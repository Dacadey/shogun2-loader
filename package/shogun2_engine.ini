; Shogun 2 engine fixes. To turn them all off, delete the DLL: version.dll or plugins\shogun2_engine.asi.
; Values: 1 or 0 for on/off (yes/no, true/false and on/off also work). A value the DLL does not
;        understand keeps its default; shogun2_engine.log then has a line starting with "ini:".
; threads: free lets Windows place the main thread and the worker pool on any core;
;        engine pins them as the game does (main thread on core 0, one pool thread per core).
; main_thread: pcores makes the main thread prefer the performance cores (hybrid CPUs); any.
; workers: the cores the pool threads prefer: any, pcores or ecores.
; worker_count: threads in the pool, main thread included; 0 keeps the game's choice.
; pack_cache: 1 reads the .pack files through the Windows file cache (repeated loads come from RAM).
; texture_fast_path: 1 makes textures straight from the file when it already holds the format the
;        game asks for, instead of D3DX re-encoding every one (most of a battle's load time); 0 off.
; loads_without_vsync: 1 draws the loading screen without waiting for vsync. With vsync on that saved
;        1.3-3.4 s per load at 120 Hz (60 Hz was not measured), almost nothing at 240 Hz;
;        the game itself keeps vsync. 0: as the game does it.
; skip_intro_movies: 1 goes straight to the main menu.
; frame_log: 1 writes shogun2_frames.csv (frame times and the main thread's CPU), for diagnostics:
;        about 15 MB an hour at 240 fps; the file is written anew at every start.
; memory_log: 1 logs the 32-bit address space every 30 s.
; crash_dumps: 1 writes a minidump to %APPDATA%\The Creative Assembly\Shogun2\crash_dumps on a crash.
[engine]
threads=free
main_thread=pcores
workers=any
worker_count=0
pack_cache=1
texture_fast_path=1
loads_without_vsync=1
skip_intro_movies=0
frame_log=0
memory_log=1
crash_dumps=1
